<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07070b">
  <title>Piano Trainer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <style>
    /* Dark glass look to match the falling notes: --grad is the hit-line gradient (left hand -> right hand). */
    :root { --bg: #07070b; --fg: #f2f2f7; --muted: #8b8b9c; --panel: rgba(255, 255, 255, .045); --line: rgba(255, 255, 255, .09);
      --chip: #171720; --track: #1c1c26;
      --grad: linear-gradient(90deg, hsl(190 95% 58%), hsl(270 95% 66%), hsl(325 95% 62%), hsl(32 95% 58%)); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 17px/1.4 -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; }
    nav { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 4px; z-index: 2;
      background: rgba(7, 7, 11, .82); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line);
      padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); }
    nav button { position: relative; font-size: 18px; font-weight: 600; letter-spacing: .01em; padding: 10px 22px; min-height: 52px;
      background: transparent; color: var(--muted); box-shadow: none; }
    nav button.on { color: var(--fg); background: var(--panel); box-shadow: none; }
    nav button.on::after { content: ''; position: absolute; left: 18px; right: 18px; bottom: 4px; height: 3px; border-radius: 2px; background: var(--grad); }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding: 96px 24px 24px; }
    main[hidden] { display: none; }
    #library { justify-content: flex-start; align-items: stretch; gap: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    button { font: inherit; font-size: 26px; padding: 18px 56px; min-height: 72px; border: 0; border-radius: 999px;
      background: var(--grad); color: #0a0a10; font-weight: 700; touch-action: manipulation;
      box-shadow: 0 0 28px rgba(190, 90, 255, .28); transition: transform .08s, opacity .15s; }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .4; }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .btn, .small { font: inherit; font-weight: 600; border: 1px solid var(--line); border-radius: 14px; touch-action: manipulation;
      display: inline-flex; align-items: center; justify-content: center; background: var(--panel); color: var(--fg); box-shadow: none; }
    .btn { font-size: 17px; padding: 10px 22px; min-height: 52px; }
    .small { font-size: 16px; padding: 6px 16px; min-height: 48px; min-width: 48px; }
    .btn.primary { background: var(--grad); color: #0a0a10; border-color: transparent; box-shadow: 0 0 22px rgba(190, 90, 255, .3); }
    /* Selected: dark chip with a gradient outline. */
    .small.on { color: #fff; border: 1.5px solid transparent;
      background: linear-gradient(var(--chip), var(--chip)) padding-box, var(--grad) border-box; }
    .small.danger { color: #fb7185; }
    .song { display: flex; align-items: center; gap: 10px; padding: 12px 16px; margin-bottom: 10px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px; }
    .song .info { flex: 1; min-width: 0; }
    .song .title { font-size: 22px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .muted { color: var(--muted); font-size: 16px; }
    #msg { min-height: 1.4em; }
    dialog { background: #101017; color: var(--fg); border: 1px solid var(--line); border-radius: 20px; padding: 24px; width: min(92vw, 760px); max-height: 88vh; }
    dialog::backdrop { background: rgba(0, 0, 0, .65); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    dialog h2 { margin: 0 0 8px; }
    .row { display: flex; align-items: center; gap: 12px; margin: 10px 0; flex-wrap: wrap; }
    .row > .label { flex: 1; min-width: 200px; }
    /* Segmented group: one panel, options sit inside it. */
    .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
    .seg .small { border-color: transparent; background: transparent; color: var(--muted); min-height: 44px; }
    .seg .small.on { color: #fff; border-color: transparent; background: linear-gradient(var(--chip), var(--chip)) padding-box, var(--grad) border-box; }
    .seg .small:disabled { opacity: .35; }
    .seg[data-label]::before { content: attr(data-label); align-self: center; padding: 0 8px 0 11px; color: var(--muted); font-size: 16px; }
    #p-guide::before { content: 'Guide'; align-self: center; padding: 0 8px 0 11px; color: var(--muted); font-size: 16px; }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 280px; height: 44px; background: transparent; }
    input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--grad); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -11px; border-radius: 50%;
      background: #fff; box-shadow: 0 0 0 5px rgba(255, 255, 255, .12), 0 2px 10px rgba(0, 0, 0, .6); }
    input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--grad); }
    input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: #fff; }
    #practice { justify-content: flex-start; align-items: stretch; gap: 8px;
      padding: 88px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
    #practice .bar { gap: 8px; }
    .tempo { display: inline-flex; align-items: center; gap: 10px; padding: 0 14px; min-height: 52px; color: var(--muted); font-size: 16px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
    .tempo span { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 3ch; }
    .tempo input { width: 180px; }
    #sheet { flex: 1; min-height: 0; width: 100%; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #f7f5ef; border-radius: 12px; }
    #sheet[hidden], #fall[hidden] { display: none; }
    #fall { flex: 1; min-height: 0; width: 100%; border-radius: 14px; touch-action: none; }
    .meter { width: min(80vw, 720px); height: 14px; background: var(--track); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
    .meter > div { height: 100%; width: 0; background: var(--grad); background-size: min(80vw, 720px) 100%; transition: width 50ms linear; }
    #status { color: var(--muted); min-height: 1.4em; }
    #note { font-size: 140px; font-weight: 700; line-height: 1; min-height: 140px; font-variant-numeric: tabular-nums; }
    #detail { color: var(--muted); font-size: 22px; min-height: 1.4em; font-variant-numeric: tabular-nums; }
    #drills { justify-content: flex-start; align-items: stretch; gap: 12px;
      padding: 88px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
    #d-msg { font-size: 26px; font-weight: 600; min-height: 1.4em; text-align: center; }
    #staff { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; background: #f7f5ef; border-radius: 12px; }
    #d-hint { display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 0; }
    #d-hint:empty { display: none; }
    #d-hint svg { max-width: 100%; height: auto; }
    .d-name { font-size: 34px; font-weight: 700; }
    .mic { width: 60px; height: 10px; align-self: center; background: var(--track); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
    .mic i { display: block; height: 100%; width: 0; background: var(--grad); }
    .beat { align-self: center; width: 18px; height: 18px; margin: 0 10px 0 4px; border-radius: 50%; background: var(--track); }
    .beat.on { background: #fff; box-shadow: 0 0 14px #fff; }
    .beat.down { background: var(--grad); box-shadow: 0 0 18px rgba(255, 120, 200, .8); }
    #stats { justify-content: flex-start; align-items: stretch; gap: 10px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #stats h3 { margin: 12px 0 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 18px; }
    .card b { display: block; font-size: 30px; font-variant-numeric: tabular-nums; }
    .chart { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; }
    .chart > div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
    .chart i { display: block; width: 100%; min-height: 2px; border-radius: 4px; background: var(--grad); }
    #s-songs { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    #s-songs th, #s-songs td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    #s-songs th { color: var(--muted); font-weight: 600; font-size: 15px; }
    #version { position: fixed; right: 16px; bottom: 12px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <nav>
    <button id="tab-library" class="on">Library</button>
    <button id="tab-practice">Practice</button>
    <button id="tab-drills">Drills</button>
    <button id="tab-stats">Stats</button>
    <button id="tab-listen">Listen</button>
  </nav>
  <main id="library">
    <div class="bar">
      <label class="btn primary">Import song<input id="import" type="file" hidden></label>
      <button id="export" class="btn">Export backup</button>
      <label class="btn">Restore backup<input id="restore" type="file" accept=".json,application/json" hidden></label>
      <button id="headphones" class="btn">Headphones: off</button>
      <button id="chords" class="btn">Chords: relaxed</button>
    </div>
    <div id="msg" class="muted"></div>
    <div id="songs"></div>
  </main>
  <main id="practice" hidden>
    <div class="bar">
      <button id="p-play" class="btn primary" disabled>Play</button>
      <span class="mic" title="Mic level"><i id="p-mic"></i></span>
      <button id="p-restart" class="btn">Restart</button>
      <span class="seg" id="p-mode"></span>
      <span class="seg" id="p-hands"></span>
      <span class="seg" id="p-speed" data-label="Speed"></span>
      <span class="seg"><button id="p-ramp" class="small">Ramp</button><button id="p-metro" class="small">Metronome</button><span id="p-beat" class="beat"></span></span>
      <span class="seg"><button id="p-a" class="small">Section start</button><button id="p-b" class="small">Section end</button><button id="p-loop" class="small" disabled>Repeat section</button><button id="p-clear" class="small" disabled aria-label="Clear section">✕</button></span>
      <span class="seg" id="p-view"></span>
      <span class="seg" id="p-guide"></span>
      <button id="p-debug" class="small">Debug</button>
    </div>
    <div><b id="p-title"></b> <span id="p-score" class="muted">Pick a song in the Library.</span> <span id="p-viewnote" class="muted"></span></div>
    <div id="sheet" hidden></div>
    <canvas id="fall"></canvas>
  </main>
  <main id="drills" hidden>
    <div class="bar">
      <button id="d-start" class="btn primary">Start</button>
      <span class="seg" id="d-clef" data-label="Clef"></span>
      <span class="seg" id="d-range" data-label="Range"></span>
      <span class="seg" id="d-acc" data-label="♯ ♭"></span>
      <span class="seg" id="d-kind"></span>
      <span class="seg" id="d-names" data-label="Names"></span>
    </div>
    <div id="d-msg"></div>
    <div id="staff"></div>
    <div id="d-hint"></div>
    <div id="d-sum" class="muted">Tap Start, then play the note shown on the staff.</div>
  </main>
  <main id="stats" hidden>
    <div class="cards" id="s-cards"></div>
    <h3>Last 14 days</h3>
    <div class="chart" id="s-chart"></div>
    <h3>Drills</h3>
    <div id="s-drill" class="muted"></div>
    <h3>Songs</h3>
    <table id="s-songs"></table>
  </main>
  <main id="listen" hidden>
    <button id="start">Start</button>
    <div id="note">–</div>
    <div id="detail"></div>
    <div class="meter"><div id="level"></div></div>
    <div id="status">Tap Start to use the microphone.</div>
  </main>
  <dialog id="song-dialog">
    <h2 id="sd-title"></h2>
    <div class="row"><span class="label">Speed</span><span class="seg" id="sd-speed"></span></div>
    <div class="row"><span class="label">Hands to play</span><span class="seg" id="sd-hands"></span></div>
    <div class="row"><span class="label">Wait for correct note</span><span class="seg" id="sd-wait"></span></div>
    <h3>Tracks</h3>
    <div id="sd-tracks"></div>
    <div class="row" style="justify-content:flex-end">
      <button id="sd-cancel" class="btn">Cancel</button>
      <button id="sd-save" class="btn primary">Save</button>
    </div>
  </dialog>
  <div id="version">v?</div>
  <script src="vendor/tonejs-midi.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
